name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Billetterie.slnx
      - name: Build
        run: dotnet build backend/Billetterie.slnx --configuration Release --no-restore

  dependances:
    name: Vulnérabilités NuGet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Billetterie.slnx
      - name: Paquets vulnérables
        run: |
          dotnet list backend/Billetterie.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerabilites.txt
          if grep -q "has the following vulnerable packages" vulnerabilites.txt; then
            echo "Paquets vulnérables détectés."
            exit 1
          fi

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Scan Trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # Informatif : le scan est vide tant qu'il n'y a ni Dockerfile ni lockfile NuGet.
          exit-code: "0"