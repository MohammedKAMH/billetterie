services:
  db:
    image: postgres:16
    container_name: billetterie-db
    restart: "no"
    environment:
      POSTGRES_USER: ${BILLETTERIE_DB_USER}
      POSTGRES_PASSWORD: ${BILLETTERIE_DB_PASSWORD}
      POSTGRES_DB: billetterie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:16
    container_name: billetterie-keycloak-db
    restart: "no"
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: billetterie-keycloak
    command: start-dev
    restart: "no"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  api:
    build: ./backend
    container_name: billetterie-api
    restart: "no"
    depends_on:
      - db
      - keycloak
    ports:
      - "5178:8080"
    environment:
      ConnectionStrings__BilletterieDb: "Host=db;Port=5432;Database=billetterie;Username=${BILLETTERIE_DB_USER};Password=${BILLETTERIE_DB_PASSWORD}"
      Keycloak__Authority: "http://keycloak:8080/realms/billetterie"
      Keycloak__Audience: "billetterie-api"
      Keycloak__RequireHttpsMetadata: "false"
      Cors__Origins__0: "http://localhost:4200"
        
    

volumes:
  pgdata:
  keycloak_pgdata: